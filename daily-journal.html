<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindSpace | Daily Journal</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",Arial,sans-serif;
}


body{

    min-height:100vh;

    background:
    linear-gradient(135deg,#071a33,#12345d);

    color:white;

    padding:40px;

}


.container{

    max-width:900px;

    margin:auto;

}



/* Header */

.header{

    text-align:center;

    margin-bottom:40px;

}


.header h1{

    font-size:42px;

    margin-bottom:15px;

}


.header p{

    color:#b8c7dc;

    font-size:18px;

}



/* Card */


.journal-card{

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:30px;

    padding:35px;

    transition:.3s;

}


.journal-card:hover{

    transform:translateY(-8px);

    box-shadow:
    0 20px 40px rgba(0,0,0,.3);

}



/* Date */


.date{

    color:#9fb5d1;

    margin-bottom:20px;

}



/* Textarea */


textarea{

    width:100%;

    height:250px;

    border:none;

    outline:none;

    resize:none;

    border-radius:20px;

    padding:25px;

    font-size:17px;

    background:rgba(255,255,255,.1);

    color:white;

}


textarea::placeholder{

    color:#c5d4e8;

}



/* Button */


button{

    margin-top:25px;

    padding:15px 40px;

    border:none;

    border-radius:30px;

    background:#1c7cff;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:translateY(-4px);

    box-shadow:
    0 10px 25px rgba(28,124,255,.5);

}



/* Quote */


.quote{

    margin-top:30px;

    text-align:center;

    color:#c9d8ed;

    font-style:italic;

}



/* Mobile */


@media(max-width:600px){

body{

padding:20px;

}


.header h1{

font-size:32px;

}

}


</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
Daily Journal
</h1>

<p>
Write your thoughts and reflect on your day.
</p>

</div>



<div class="journal-card">


<div class="date">

Today 🌙

</div>


<textarea id="journalText" placeholder="What's on your mind today?"></textarea>



<button onclick="saveJournal()">

Save Entry

</button>



<div class="quote">

"Small reflections create meaningful changes."

</div>


</div>



</div>




<script>


function saveJournal(){

let text =
document.getElementById("journalText").value;


if(text.trim()==""){

alert("Please write something first 💙");

return;

}


localStorage.setItem(
"dailyJournal",
text
);


alert("Your journal entry has been saved 💙");


}



window.onload=function(){

let saved =
localStorage.getItem("dailyJournal");


if(saved){

document.getElementById("journalText").value=saved;

}

}


</script>


</body>

</html>
