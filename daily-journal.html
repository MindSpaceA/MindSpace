<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace | Daily Journal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #071a33, #12345d, #1c4b82);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* BACKGROUND GLOWS */
        body::before {
            content: "";
            position: fixed;
            width: clamp(250px, 40vw, 450px);
            height: clamp(250px, 40vw, 450px);
            background: #4dc7ff;
            filter: blur(140px);
            top: -100px;
            right: -100px;
            opacity: .25;
            z-index: -1;
        }

        /* HEADER */
        header {
            width: 90%;
            max-width: 1100px;
            padding: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: clamp(22px, 4vw, 28px);
            font-weight: 800;
            color: #9fdcff;
        }

        .back {
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, .2);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            transition: .3s;
        }

        .back:hover {
            background: #8fd3ff;
            color: #071a33;
        }

        /* CONTAINER */
        .container {
            width: 90%;
            max-width: 850px;
            margin-top: 10px;
            flex: 1;
        }

        /* PAGE HEADER */
        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: clamp(32px, 6vw, 46px);
            margin-bottom: 12px;
            font-weight: 800;
        }

        .page-header p {
            color: #b8c7dc;
            font-size: clamp(15px, 2.5vw, 18px);
        }

        /* JOURNAL CARD */
        .journal-card {
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 30px;
            padding: clamp(25px, 5vw, 40px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
            transition: .3s ease;
        }

        .date {
            color: #9fb5d1;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* TEXTAREA */
        textarea {
            width: 100%;
            height: clamp(220px, 40vh, 300px);
            border: 1px solid rgba(255, 255, 255, .15);
            outline: none;
            resize: vertical;
            border-radius: 20px;
            padding: 22px;
            font-size: 16px;
            line-height: 1.6;
            background: rgba(255, 255, 255, .07);
            color: white;
            transition: .3s;
        }

        textarea:focus {
            border-color: #8fd3ff;
            background: rgba(255, 255, 255, .12);
            box-shadow: 0 0 15px rgba(143, 211, 255, .2);
        }

        textarea::placeholder {
            color: #b0c4de;
        }

        /* BUTTON */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        button {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #1c7cff, #4dc7ff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(28, 124, 255, .4);
        }

        /* QUOTE */
        .quote {
            text-align: center;
            color: #c9d8ed;
            font-style: italic;
            margin-top: 30px;
            font-size: 15px;
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            color: #b8d8ef;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            button {
                width: 100%;
            }

            header {
                flex-direction: row;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🧠 MindSpace</div>
        <a href="index.html" class="back">← Home</a>
    </header>

    <div class="container">

        <div class="page-header">
            <h1>Daily Journal</h1>
            <p>Write your thoughts and reflect on your day.</p>
        </div>

        <div class="journal-card">
            <div class="date" id="currentDate">
                🌙 Loading date...
            </div>

            <textarea id="journalText" placeholder="What's on your mind today? How are you feeling?"></textarea>

            <div class="actions">
                <button onclick="saveJournal()">Save Entry</button>
            </div>

            <div class="quote">
                "Small reflections create meaningful changes."
            </div>
        </div>

    </div>

    <footer>
        MindSpace © 2026 | Wellbeing guides for a healthier mind.
    </footer>

    <script>
        // Set today's date automatically
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const today = new Date().toLocaleDateString('en-US', options);
        document.getElementById('currentDate').innerHTML = `🌙 ${today}`;

        function saveJournal() {
            let text = document.getElementById("journalText").value;

            if (text.trim() == "") {
                alert("Please write something first 💙");
                return;
            }

            localStorage.setItem("dailyJournal", text);
            alert("Your journal entry has been saved 💙");
        }

        window.onload = function() {
            let saved = localStorage.getItem("dailyJournal");
            if (saved) {
                document.getElementById("journalText").value = saved;
            }
        }
    </script>

</body>

</html>
