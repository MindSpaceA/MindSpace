<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindSpace | Relaxing Sounds</title>
<link rel="stylesheet" href="responsive.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",Arial,sans-serif;
}


body{

    min-height:100vh;

    background:
    linear-gradient(135deg,#071a33,#12345d);

    color:white;

    padding:40px;

}



.container{

    max-width:1000px;

    margin:auto;

}



/* Header */

.header{

    text-align:center;

    margin-bottom:45px;

}


.header h1{

    font-size:42px;

    margin-bottom:15px;

}


.header p{

    color:#b8c7dc;

    font-size:18px;

}




/* Sounds Grid */


.sounds{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:25px;

}




.sound-card{

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:30px;

    padding:35px 25px;

    text-align:center;

    transition:.35s;

}



.sound-card:hover{

    transform:translateY(-10px);

    box-shadow:
    0 20px 40px rgba(0,0,0,.3);

    background:rgba(255,255,255,.13);

}




.icon{

    width:90px;

    height:90px;

    border-radius:50%;

    background:rgba(28,124,255,.25);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:45px;

    margin:0 auto 20px;

    transition:.3s;

}



.sound-card:hover .icon{

    transform:scale(1.15);

    background:#1c7cff;

}





.sound-card h3{

    margin-bottom:12px;

}



.sound-card p{

    color:#c3d2e7;

    line-height:1.6;

}





button{

    margin-top:25px;

    padding:13px 30px;

    border:none;

    border-radius:30px;

    background:#1c7cff;

    color:white;

    cursor:pointer;

    font-size:15px;

    transition:.3s;

}



button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 25px rgba(28,124,255,.5);

}




.player{

    margin-top:40px;

    background:rgba(255,255,255,.08);

    border-radius:25px;

    padding:25px;

    text-align:center;

    border:1px solid rgba(255,255,255,.15);

}




audio{

    width:100%;

    margin-top:20px;

}




@media(max-width:800px){

.sounds{

grid-template-columns:1fr;

}


.header h1{

font-size:32px;

}


body{

padding:20px;

}

}


</style>


</head>


<body>


<div class="container">


<div class="header">

<h1>
Relaxing Sounds
</h1>

<p>
Take a moment to relax, breathe and clear your mind.
</p>

</div>




<div class="sounds">



<div class="sound-card">

<div class="icon">
🌧️
</div>

<h3>
Rain Sounds
</h3>

<p>
Soft rain sounds to calm your thoughts.
</p>

<button onclick="playSound('rain')">
Play
</button>

</div>




<div class="sound-card">

<div class="icon">
🌊
</div>

<h3>
Ocean Waves
</h3>

<p>
Relax with peaceful ocean waves.
</p>

<button onclick="playSound('ocean')">
Play
</button>

</div>




<div class="sound-card">

<div class="icon">
🌲
</div>

<h3>
Forest Nature
</h3>

<p>
Feel connected with natural sounds.
</p>

<button onclick="playSound('forest')">
Play
</button>

</div>



</div>




<div class="player">


<h2>
Now Playing 🎧
</h2>


<audio id="audio" controls>

<source id="source" src="" type="audio/mpeg">

</audio>


</div>



</div>




<script>


function playSound(type){


let audio =
document.getElementById("audio");


let source =
document.getElementById("source");



if(type=="rain"){

source.src =
"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

}


if(type=="ocean"){

source.src =
"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3";

}


if(type=="forest"){

source.src =
"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3";

}



audio.load();

audio.play();


}


</script>



</body>

</html>
